name: 🕷️ Robô Caçador de Editais

# Trigger por agendamento está DESATIVADO até termos persistência externa
# do banco vetorial (ver `Próximos passos` no README e `docs/deploy_huggingface.md`).
# Por enquanto, só roda manualmente via "Run workflow" no GitHub Actions.
on:
  workflow_dispatch:

# Sem permissões de escrita: o workflow já não tenta commitar banco_vetorial.
# Quando voltar a fazer push (para uma branch de deploy ou storage externo),
# reativar `contents: write` ou usar um token específico.
permissions:
  contents: read

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🤖 Executar o crawler
        run: python src/oraculo/crawler.py

      # NOTA: o passo de commit/push do banco_vetorial foi removido.
      # O ChromaDB persistente do runner é volátil e só serve para validar
      # que o crawler roda sem erro neste ambiente. Para que os dados
      # cheguem ao Hugging Face Space, ainda é necessário rodar o crawler
      # localmente e fazer push da branch hf-deploy (ver
      # docs/deploy_huggingface.md).
